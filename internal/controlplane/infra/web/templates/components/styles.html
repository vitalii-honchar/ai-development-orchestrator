{{define "styles"}}
<style>
    :root {
        color-scheme: dark;
        --bg: #0b1c20; --surface: #10272c; --surface-deep: #0b2025;
        --raised: #17343a; --hover: #1c3e43;
        --border: #2b4c52; --border-strong: #64858a;
        --text: #efe8dc; --muted: #b1c4c2; --subtle: #95abaa;
        --accent: #e4a17b; --accent-hover: #f2b58e; --accent-ink: #172226;
        --accent-wash: #323832; --teal: #90d2c5; --focus: #f2b58e;
        --selection: #365c5d; --editor-bg: #0c2329;
        --font-display: 'Bricolage Grotesque', 'Trebuchet MS', sans-serif;
        --font-sans: 'IBM Plex Sans', 'Helvetica Neue', sans-serif;
        --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 14px/1.5 var(--font-sans); -webkit-font-smoothing: antialiased; }
    h1, h2, h3, p, pre, dl, dd { margin: 0; }
    h1 { font-family: var(--font-display); font-size: 40px; line-height: 1.15; font-weight: 600; letter-spacing: -.035em; overflow-wrap: anywhere; }
    h2, h3 { font-size: 14px; font-weight: 500; letter-spacing: -.01em; }
    a { color: inherit; text-decoration: none; }
    button, input, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    svg { display: block; flex-shrink: 0; }
    code, .mono { font-family: var(--font-mono); font-size: 12px; }
    time, .tabular { font-variant-numeric: tabular-nums; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; border-radius: 3px; }
    ::selection { background: var(--selection); color: var(--text); }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    .skip-link { position: fixed; top: -100px; left: 16px; z-index: 20; padding: 12px 16px; background: var(--text); color: var(--bg); border-radius: 6px; }
    .skip-link:focus { top: 12px; }
    .app-header { border-top: 3px solid var(--accent); border-bottom: 1px solid var(--border); background: var(--surface-deep); }
    .app-header-inner { max-width: 1440px; margin: auto; min-height: 78px; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; gap: 44px; }
    .brand { display: inline-flex; align-items: center; gap: 14px; flex-shrink: 0; white-space: nowrap; }
    .brand-mark { display: grid; place-items: center; width: 48px; height: 48px; color: var(--accent-ink); background: var(--accent); clip-path: polygon(0 0, 82% 0, 100% 18%, 100% 100%, 0 100%); }
    .brand-wordmark { display: grid; gap: 4px; }
    .brand-name { font: 500 21px/1.1 var(--font-display); letter-spacing: -.025em; color: var(--text); }
    .brand-name strong { font-weight: 700; }
    .brand-author { color: var(--accent); font: 10px/1.4 var(--font-mono); letter-spacing: .04em; }
    .app-nav { display: flex; align-self: stretch; gap: 8px; }
    .app-nav a { display: flex; align-items: center; position: relative; padding: 0 18px; font-size: 13px; color: var(--muted); white-space: nowrap; transition: color .15s, background .15s; }
    .app-nav a[aria-current] { color: var(--accent); background: #e4a17b08; }
    .app-nav a[aria-current]::after { content: ''; position: absolute; bottom: -1px; height: 3px; background: var(--accent); left: 18px; right: 18px; }
    .app-nav a:hover { color: var(--text); background: var(--raised); }
    .app-main { max-width: 1320px; margin: 0 auto; padding: 32px 40px 56px; }
    .page-heading { display: flex; justify-content: space-between; align-items: center; gap: 24px; margin-bottom: 28px; padding-bottom: 28px; border-bottom: 1px solid var(--border); }
    .page-heading > div { min-width: 0; }
    .page-description { color: var(--muted); margin-top: 9px; font-size: 14px; line-height: 1.7; max-width: 760px; }
    .button { display: inline-flex; justify-content: center; align-items: center; gap: 8px; min-height: 44px; padding: 10px 16px; border: 1px solid var(--border-strong); border-radius: 3px; font-size: 13px; font-weight: 600; line-height: 1.4; white-space: nowrap; transition: background .15s, border-color .15s, box-shadow .15s; }
    .button-primary { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); box-shadow: inset 0 -2px #7c4c2c40; }
    .button-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .button-secondary { color: var(--text); background: var(--surface); }
    .button-secondary:hover { background: var(--hover); border-color: var(--teal); }
    .back-link { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; margin-bottom: 22px; }
    .back-link:hover { color: var(--accent); }
    .back-link span { font-size: 16px; }
    .panel { border: 1px solid var(--border); border-radius: 6px; background: var(--surface); overflow: hidden; }
    .panel-heading { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .panel-heading h2 { display: inline-flex; align-items: center; gap: 10px; font: 500 13px/1.5 var(--font-sans); }
    .count { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 22px; padding: 0 6px; border: 1px solid #e4a17b4d; border-radius: 2px; color: var(--accent); background: var(--accent-wash); font: 11px var(--font-mono); }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    .panel-message { padding: 24px 20px; color: var(--muted); font-size: 13px; }
    .table-scroll { overflow-x: auto; }
    .table-hint { display: none; }
    .table-scroll:focus-visible { outline-offset: -3px; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    thead { color: var(--muted); background: var(--surface-deep); font: 11px/1.5 var(--font-mono); }
    th { font-weight: 500; }
    th, td { padding: 13px 20px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tbody tr:last-child > * { border-bottom: 0; }
    .catalog-table { min-width: 750px; }
    .catalog-table tbody tr { transition: background .15s; }
    .catalog-table tbody tr:hover { background: var(--hover); }
    .catalog-table tbody th { width: 46%; padding-top: 20px; padding-bottom: 20px; font-weight: 400; }
    .definition-link { display: inline-flex; align-items: center; gap: 9px; max-width: 100%; font-weight: 500; color: var(--text); overflow-wrap: anywhere; }
    .definition-link:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 4px; }
    .definition-link svg { color: var(--subtle); transition: color .15s, transform .15s; }
    .definition-link:hover svg { color: var(--accent); transform: translateX(2px); }
    .catalog-description { margin-top: 5px; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
    .catalog-actions { display: grid; justify-items: start; gap: 12px; }
    .catalog-actions .button { font-size: 12px; }
    .definition-overline { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .execution-link { display: inline-grid; gap: 7px; }
    .run-reference { display: inline-flex; gap: 12px; align-items: center; color: var(--subtle); font: 11px var(--font-mono); }
    .execution-link:hover .run-reference { color: var(--accent); }
    .date-cell { white-space: nowrap; color: var(--muted); font-size: 12px; }
    .date-cell span { display: block; color: var(--subtle); font: 11px var(--font-mono); margin-top: 4px; }
    .status { display: inline-flex; align-items: center; gap: 7px; padding: 4px 9px; border: 1px solid var(--border); border-radius: 4px; color: var(--muted); background: var(--raised); font: 500 12px/1.4 var(--font-sans); white-space: nowrap; }
    .status::before { content: ''; width: 5px; height: 5px; border-radius: 1px; background: currentColor; }
    .status-active { color: #a0dfbf; border-color: #3b6b5c; background: #16392e; }
    .status-draft { color: #efc688; border-color: #776142; background: #3a3224; }
    .status-failed { color: #ffb0a5; border-color: #855348; background: #422a27; }
    .eyebrow { display: flex; align-items: center; gap: 10px; color: var(--accent); text-transform: uppercase; font: 500 10px var(--font-mono); letter-spacing: .12em; margin-bottom: 14px; }
    .eyebrow::before { content: ''; width: 20px; height: 2px; background: var(--accent); }
    .execution-launch { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 24px; }
    .execution-launch-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .execution-filters { display: flex; align-items: flex-end; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
    .execution-filter-field { display: grid; gap: 8px; flex: 1 1 260px; min-width: 0; max-width: 460px; }
    .execution-filter-field label { color: var(--muted); font-size: 12px; }
    .execution-filter-field select { width: 100%; min-width: 0; min-height: 44px; padding: 10px 12px; color: var(--text); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 3px; font: inherit; }
    .empty-action { margin-top: 24px; }
    .text-link { text-decoration: underline; text-underline-offset: 4px; }
    .page-actions { display: flex; align-items: center; gap: 22px; flex-shrink: 0; }
    .execution-summary-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 12px 18px; margin: -4px 0 28px; }
    .execution-summary-bar strong { color: var(--text); font-weight: 500; margin-left: 6px; }
    .execution-status-note { margin: -12px 0 24px; color: var(--muted); font-size: 13px; }
    .current-step-label { color: var(--muted); font-size: 12px; padding-left: 18px; border-left: 1px solid var(--border); }
    .execution-workspace { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 32px; align-items: start; }
    .execution-progress { padding-top: 17px; min-width: 0; }
    .execution-progress > h2 { padding: 0 12px 16px; color: var(--muted); font-size: 13px; }
    .step-progress-list { list-style: none; padding: 0; margin: 0; }
    .step-progress-item { margin-bottom: 8px; border-radius: 5px; }
    .step-progress-item button { display: flex; align-items: center; width: 100%; gap: 12px; padding: 15px 12px; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 5px; color: var(--muted); }
    .step-progress-item button:hover { background: var(--surface); }
    .step-progress-item.is-current button { background: #e4a17b0d; border-color: #e4a17b59; }
    .step-progress-icon { font: 18px var(--font-mono); width: 22px; text-align: center; color: var(--subtle); }
    .step-progress-item[data-step-state="COMPLETED"] .step-progress-icon { color: #a0dfbf; }
    .step-progress-item[data-step-state="FAILED"] .step-progress-icon { color: #ffb0a5; }
    .step-progress-item.is-current .step-progress-icon { color: var(--accent); font-size: 13px; }
    .step-progress-copy { display: grid; gap: 4px; min-width: 0; }
    .step-progress-copy strong { font: 500 13px var(--font-mono); color: var(--text); overflow-wrap: anywhere; }
    .step-progress-copy > span { color: var(--muted); font-size: 11px; }
    .step-progress-time { margin-left: auto; color: var(--subtle); font: 11px var(--font-mono); }
    .execution-supporting-details { margin-top: 28px; }
    .execution-disclosure { border-bottom: 1px solid var(--border); }
    .execution-disclosure > summary { display: list-item; padding: 17px 0; color: var(--muted); cursor: pointer; font-size: 13px; }
    .execution-disclosure > .execution-step-metadata { margin: 0 0 20px; }
    .execution-disclosure .execution-parameters { padding: 0; }
    .definition-details { margin-bottom: 24px; }
    .definition-details summary > span { margin-left: 10px; }
    .execution-parameters { padding: 0 20px; }
    .execution-parameter { padding: 18px 0; }
    .execution-parameter + .execution-parameter { border-top: 1px solid var(--border); }
    .execution-parameter dt { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
    .execution-parameter dt > code { min-width: 0; overflow-wrap: anywhere; }
    .copy-value { margin-left: auto; }
    .copy-feedback { flex-basis: 100%; color: var(--muted); font-size: 12px; }
    .copy-feedback:empty { display: none; }
    .parameter-type { color: var(--subtle); font: 10px var(--font-mono); font-weight: 400; padding: 2px 6px; background: var(--raised); border: 1px solid var(--border); border-radius: 4px; }
    .execution-parameter pre { font: 12px/1.8 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); }
    .execution-summary { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; line-height: 1.8; }
    .execution-json { margin-top: 12px; }
    .execution-json summary { color: var(--subtle); font-size: 11px; cursor: pointer; }
    .execution-json pre { margin-top: 12px; }
    .execution-step { padding: 24px; }
    .execution-step + .execution-step { border-top: 1px solid var(--border); }
    .execution-step-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .execution-step-heading h3 { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .execution-step-heading h3 code { font-size: 14px; overflow-wrap: anywhere; }
    .execution-step-metadata { display: flex; flex-wrap: wrap; gap: 20px 40px; margin: 22px 0; }
    .execution-step-metadata dt { color: var(--subtle); font-size: 11px; margin-bottom: 6px; }
    .execution-step-metadata dd { font: 12px var(--font-mono); }
    .execution-step-result { background: var(--surface-deep); border: 1px solid var(--border); border-radius: 6px; }
    .execution-step-result h4 { margin: 0; padding: 12px 16px; color: var(--muted); font-size: 11px; font-weight: 500; border-bottom: 1px solid var(--border); }
    .execution-step-result .execution-parameters { padding: 0 16px; }
    .execution-step-inputs { margin-top: 18px; }
    .execution-step-inputs > summary { color: var(--muted); font-size: 12px; cursor: pointer; }
    .execution-step-inputs .count { margin-left: 6px; }
    .execution-step-inputs .execution-parameters { padding: 0; }
    .execution-empty { padding: 40px 24px; }
    .execution-create { max-width: 820px; margin: 0 auto; }
    .execution-fields { display: grid; gap: 28px; }
    .execution-field { min-width: 0; overflow-wrap: anywhere; }
    .execution-field label { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; font-weight: 500; }
    .field-requirement { margin-left: auto; color: var(--subtle); font-size: 11px; }
    .execution-field textarea { width: 100%; display: block; resize: vertical; padding: 12px 14px; color: var(--text); background: var(--editor-bg); border: 1px solid var(--border-strong); border-radius: 5px; font: 12px/1.7 var(--font-mono); }
    .execution-field > input { width: 100%; min-height: 44px; padding: 11px 14px; color: var(--text); background: var(--editor-bg); border: 1px solid var(--border-strong); border-radius: 5px; font: 13px var(--font-mono); }
    .input-guidance { margin-bottom: 24px; color: var(--muted); font-size: 13px; }
    .required-label, .field-requirement.required-label { color: var(--accent); }
    .field-help { margin-top: 9px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .execution-create .definition-actions > p { margin-right: auto; }
    .input-editor-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .text-button { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--teal); font-size: 12px; }
    .text-button:hover { background: var(--hover); border-color: var(--teal); }
    .execution-editor { position: relative; }
    .execution-monaco { height: 240px; border: 1px solid var(--border); border-radius: 5px; overflow: hidden; background: var(--editor-bg); }
    .execution-monaco:focus-within { border-color: var(--teal); }
    .directory-field { display: flex; gap: 10px; }
    .directory-field input { width: 100%; min-width: 0; padding: 12px 14px; color: var(--text); background: var(--editor-bg); border: 1px solid var(--border); border-radius: 5px; font: 12px var(--font-mono); }
    .directory-field input::placeholder { color: var(--subtle); }
    .field-error { margin-top: 10px; font-size: 12px; color: #ffb0a5; }
    .button:disabled { cursor: wait; opacity: .6; }
    .empty-state { text-align: center; padding: 64px 24px; }
    .empty-icon { margin: 0 auto 20px; display: grid; place-items: center; width: 48px; height: 48px; color: var(--muted); border: 1px solid var(--border); border-radius: 10px; background: var(--raised); }
    .empty-state h3 { font-size: 16px; }
    .empty-state p { margin: 8px auto 0; max-width: 360px; font-size: 13px; color: var(--muted); }
    .definition-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; padding-bottom: 26px; margin-bottom: 26px; border-bottom: 1px solid var(--border); }
    .definition-heading > div { min-width: 0; flex: 1; }
    .definition-description { white-space: pre-wrap; overflow-wrap: anywhere; }
    .definition-tabs { display: inline-flex; padding: 0; gap: 0; background: var(--surface-deep); border: 1px solid var(--border); border-radius: 3px; flex-shrink: 0; }
    .definition-tabs a { padding: 10px 16px; color: var(--muted); font-size: 12px; transition: color .15s, background .15s; }
    .definition-tabs a:hover { color: var(--text); }
    .definition-tabs a[aria-current="page"] { color: var(--accent); background: var(--accent-wash); box-shadow: inset 0 -2px var(--accent); }
    .definition-metadata { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--border); border-radius: 4px; margin-bottom: 24px; background: var(--surface-deep); }
    .definition-metadata > div { padding: 16px 20px; min-width: 0; }
    .definition-metadata > div + div { border-left: 1px solid var(--border); }
    .definition-metadata dt, .definition-section-label { color: var(--muted); font-size: 12px; }
    .definition-metadata dd { margin-top: 8px; font-size: 12px; overflow-wrap: anywhere; }
    .definition-metadata .mono { font-size: 11px; }
    .definition-panels > * { min-width: 0; }
    .definition-panels { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
    .process-graph-canvas { padding: 28px 20px; overflow: auto; min-height: 240px; max-height: 740px; background: var(--surface-deep); }
    .process-graph-canvas svg { display: block; margin: 0 auto; }
    .process-graph-canvas .step-node-interactive { cursor: pointer; }
    .process-graph-canvas .step-node-interactive:hover > :is(rect, circle, polygon), .process-graph-canvas .step-node-interactive:focus > :is(rect, circle, polygon) { filter: brightness(1.35); stroke-width: 4px; }
    .process-graph-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 14px 20px; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 11px; }
    .process-graph-legend > span { display: inline-flex; align-items: center; gap: 8px; }
    .graph-key { display: inline-block; width: 14px; height: 11px; border: 1px solid; border-radius: 3px; }
    .graph-key-codex { color: #71b7ff; background: #102b46; }
    .graph-key-current { color: var(--accent); background: #34352d; }
    .graph-key-completed { color: #a0dfbf; background: #16392e; }
    .graph-key-failed { color: #ffb0a5; background: #422a27; }
    .graph-key-end { color: #fa949e; background: #381b20; width: 12px; height: 12px; border: 3px double; border-radius: 50%; }
    .graph-context { padding: 12px 20px; border-top: 1px solid var(--border); color: var(--subtle); font-size: 11px; }
    .execution-details-index { margin-top: 20px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); }
    .execution-details-index > summary { padding: 16px 20px; color: var(--muted); cursor: pointer; font-size: 12px; }
    .execution-details-index .count { margin-left: 8px; }
    .execution-node-detail { border-top: 1px solid var(--border); }
    .execution-node-detail > summary { padding: 14px 20px; cursor: pointer; }
    .execution-node-detail > summary span { margin-left: 16px; }
    .step-detail-note { margin-top: 16px; color: var(--muted); font-size: 12px; line-height: 1.8; }
    .step-next { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 24px; border-top: 1px solid var(--border); padding-top: 16px; }
    .execution-step-dialog { width: min(800px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); padding: 0; color: var(--text); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 5px; overflow: auto; box-shadow: 0 24px 100px #000b; }
    .execution-step-dialog::backdrop { background: #041519cf; backdrop-filter: blur(4px); }
    .discard-dialog { width: min(480px, calc(100vw - 32px)); }
    .discard-dialog-content { padding: 24px; }
    .discard-dialog-content h2 { font: 600 24px/1.3 var(--font-display); }
    .discard-dialog-content > p { margin-top: 12px; color: var(--muted); }
    .discard-dialog .definition-actions { flex-wrap: wrap; }
    .step-dialog-bar { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 20px; background: var(--raised); border-bottom: 1px solid var(--border); z-index: 1; }
    .execution-step-dialog .execution-step { min-width: 0; }
    .execution-step-dialog .execution-step-heading code { word-break: break-word; }
    .definition-table { font-size: 12px; }
    .definition-table td, .definition-table th { vertical-align: top; overflow-wrap: anywhere; }
    .definition-steps { min-width: 740px; }
    .definition-values { display: flex; flex-wrap: wrap; gap: 36px; padding: 20px; }
    .definition-values dd { margin-top: 10px; font: 14px var(--font-mono); }
    .step-values { font-size: 12px; line-height: 1.8; color: var(--muted); }
    .editor-note { padding-bottom: 20px; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .definition-editor { border: 1px solid var(--border-strong); border-radius: 4px; overflow: hidden; background: var(--editor-bg); }
    .definition-editor:focus-within { border-color: var(--teal); }
    .definition-editor-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 18px; background: var(--raised); border-bottom: 1px solid var(--border); font: 12px var(--font-mono); }
    .definition-editor-bar > span:nth-child(2) { color: var(--muted); font-size: 11px; }
