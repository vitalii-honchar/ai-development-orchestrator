name: Go CI

on:
  push:

permissions:
  contents: read

env:
  CGO_ENABLED: "1"
  GOFLAGS: -mod=vendor
  GOPROXY: "off"
  GOSUMDB: "off"

jobs:
  check:
    name: Code style, build and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            lint/go-arch-lint/go.sum
            lint/golangci-lint/go.sum

      - name: Check code style and architecture
        run: make lint

      - name: Reject formatting changes
        run: git diff --exit-code

      - name: Build all packages
        run: go build ./...

      - name: Run tests and require new-code coverage above 80%
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_REF: ${{ github.ref }}
        run: |
          base=origin/main
          if [ "$PUSH_REF" = refs/heads/main ]; then
            base="$PUSH_BEFORE"
            if ! git cat-file -e "$base^{commit}"; then
              git fetch --no-tags origin "$base"
            fi
          fi
          make coverage COVERAGE_BASE="$base"
